services:
  mitramite:
    build: .
    restart: unless-stopped
    env_file: .env
    mem_limit: 128m
    # Stateless: sin logs, FS только для чтения.
    logging:
      driver: "none"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
